name: CI

on:
  push:
  pull_request:

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Lint schemas
        run: |
          linkml-lint --config .linkmllint.yaml schema/datarepo.yaml
          linkml-lint --config .linkmllint.yaml schema/study/aging.yaml

      - name: Generators accept the schemas
        run: |
          gen-json-schema schema/datarepo.yaml > /dev/null
          gen-json-schema schema/study/aging.yaml > /dev/null

      - name: Valid examples validate
        run: |
          linkml-validate -s schema/datarepo.yaml -C Bundle examples/minimal_bundle.yaml
          linkml-validate -s schema/datarepo.yaml -C Bundle examples/ingested_bundle.yaml

      - name: Invalid examples are rejected
        run: |
          for f in examples/invalid/*.yaml; do
            if linkml-validate -s schema/datarepo.yaml -C Bundle "$f"; then
              echo "::error file=$f::expected validation to fail"; exit 1
            fi
          done

      - name: Generated docs are up to date
        run: python tools/build_docs.py --check

  # The Python package is FROZEN at 0.32.0 (D41): it is tested at its own release tag, against the schema it was
  # released with, so the schema can move on (0.0.14, the C# release) without a frozen generator going stale.
  ingester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.32.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # `.[readers]` pulls pyMzLib from PyPI, where it is the `mzlib` distribution. Its wheels are
      # per-platform and carry the mzLib bridge, so the end-to-end ingest tests run here rather
      # than skipping, and nothing has to set PYMZLIB_BRIDGE. `.[mcp]` pulls the MCP SDK, so
      # `datarepo mcp` is exercised here rather than only by hand.
      - run: pip install -e .[readers,mcp] -r requirements-dev.txt

      - name: Generated Arrow schemas are up to date
        run: python tools/build_tables.py --check

      - name: Tests
        run: pytest -q -rs

      - name: The CLI is wired up
        run: |
          datarepo --version
          datarepo manifest tests/data/manifest.yaml
          datarepo doctor

      # The whole path, on the fixture instance: producer output -> bundle -> catalog -> an answer.
      # It is the only check that the two commands agree about what a bundle is.
      - name: Ingest then build then query
        run: |
          datarepo ingest tests/data/manifest.yaml PXD999999 \
            --store "$RUNNER_TEMP/store" \
            --mm-settings tests/data/work_root/mm_settings/1.1.11
          datarepo build tests/data/manifest.yaml PXD999999 \
            --store "$RUNNER_TEMP/store" --out "$RUNNER_TEMP/catalog.duckdb"
          datarepo catalog "$RUNNER_TEMP/catalog.duckdb"
          datarepo query "$RUNNER_TEMP/catalog.duckdb" \
            "SELECT dataset_id, n_runs, n_psms_1pct FROM dataset_overview"

      # The MCP server opens that same catalog and answers through the tools an agent would
      # call. `--check` does it without the transport, so a failure here is the catalog or the
      # tools, never the stdio plumbing.
      - name: The MCP server serves the catalog it was built from
        run: |
          datarepo mcp --catalog "$RUNNER_TEMP/catalog.duckdb" --check
          datarepo mcp --list

      # The public site (D16) is written from that same catalog, and must need nothing else.
      - name: The static site is written from the catalog
        run: |
          datarepo site "$RUNNER_TEMP/catalog.duckdb" --out "$RUNNER_TEMP/site" \
            --base-url https://example.org/ --data-url https://example.org/store
          test -f "$RUNNER_TEMP/site/datasets/PXD999999.html"
          test -f "$RUNNER_TEMP/site/llms.txt"
          test -f "$RUNNER_TEMP/site/croissant.json"

  # The C# port (D41, design/CSHARP_PORT.md). The generated tables must match the LinkML schema,
  # exactly as tools/build_tables.py --check holds the Python ones to it.
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Generated tables are current
        run: dotnet run --project dotnet/src/DataRepo.SchemaGen -- --check
      # Includes DocsTests: the tutorial's ids and output (docs/getting-started.md) and every relative link in
      # README.md, CONTRIBUTING.md and docs/.
      - name: Build and test
        run: dotnet test dotnet/DataRepo.slnx

      # The same whole path the Python ingester job checks, through the C# `datarepo`: producer output ->
      # bundle -> catalog -> an answer -> the public site, on the fixture instance and on Linux.
      - name: The C# command line, end to end
        run: |
          dotnet build dotnet/src/DataRepo.Cli -c Release -o "$RUNNER_TEMP/cs"
          DR="$RUNNER_TEMP/cs/datarepo"
          "$DR" --version
          "$DR" manifest tests/data/manifest.yaml
          "$DR" doctor
          "$DR" ingest tests/data/manifest.yaml PXD999999 \
            --store "$RUNNER_TEMP/cs-store" \
            --mm-settings tests/data/work_root/mm_settings/1.1.11
          # PXReprise 009: --json puts one envelope, and only that, on stdout.
          "$DR" ingest tests/data/manifest.yaml PXD999999 --json \
            --store "$RUNNER_TEMP/cs-store" \
            --mm-settings tests/data/work_root/mm_settings/1.1.11 \
            | python -c "import json,sys; e=json.load(sys.stdin); assert e['ok'] and e['datasets'][0]['status']=='unchanged', e"
          "$DR" build tests/data/manifest.yaml PXD999999 \
            --store "$RUNNER_TEMP/cs-store" --out "$RUNNER_TEMP/cs-catalog.duckdb"
          "$DR" catalog "$RUNNER_TEMP/cs-catalog.duckdb"
          "$DR" query "$RUNNER_TEMP/cs-catalog.duckdb" \
            "SELECT dataset_id, n_runs, n_psms_1pct FROM dataset_overview"
          "$DR" site "$RUNNER_TEMP/cs-catalog.duckdb" --out "$RUNNER_TEMP/cs-site" \
            --base-url https://example.org/ --data-url https://example.org/store
          test -f "$RUNNER_TEMP/cs-site/datasets/PXD999999.html"
          test -f "$RUNNER_TEMP/cs-site/llms.txt"
          test -f "$RUNNER_TEMP/cs-site/croissant.json"

      # docs/cli.md is generated from this executable's own `-h` output; a changed flag or help line must
      # regenerate it (python tools/build_cli_docs.py).
      - name: The command reference matches the program
        run: python tools/build_cli_docs.py --check --exe "$RUNNER_TEMP/cs/datarepo"
