    G46 A pooled cross-species estimate must be able to see the orthology SOURCE RELEASE, and today
    it cannot. Raised by logs 002 section 3.2, and it is the same defect class as G40 with a
    different discriminating column. Their ruling: the honest key is `(source, release, group_id)`,
    NOT `group_id`, because a group id that persists while its membership changes silently is
    exactly what their snapshot-versioning constraint exists to prevent. So if we take
    `feature_type='orthogroup'` with `feature_id=<bare group id>` (our own REQ-LOGS-4 proposal),
    a pool spanning a release boundary would combine estimates computed against two different
    memberships with nothing recording it -- a meta-estimate that looks clean and is not, which is
    G40 again. Their requirement, and it is cheap: the release must be **recoverable at pooling
    time**, not merely recorded somewhere upstream. Ours to decide how -- qualify `feature_id`, or
    add a column and stratify on it alongside tissue/acquisition/quant_method. logs will ship a
    separate versioned release-to-release mapping layer so a deliberate re-pool across a boundary
    is expressible rather than accidental. Decide BEFORE `age_effect_meta` has rows; it holds 0.
