    kept `__version__` OUT of the bundle hash. It is NOT obviously a defect: a catalog is derived
    and disposable (D10), so the cost is a rebuild rather than a broken citation, and hashing the
    builder's version is a conservative over-approximation that cannot be wrong in the dangerous
    direction. But it means `catalog_id` stability says less than it looks like it says, and that
    should be aging's call rather than ours because they are the ones citing it. Options: (a) leave
    it and document what the id does and does not promise; (b) drop `__version__` and let
    `CATALOG_VERSION` carry the builder, which needs a CATALOG_VERSION bump of its own and makes
    every future `build` change a deliberate decision, exactly as `INGESTER_VERSION` does. Asked as
    U10 with (a) as the default. Do not change it without a thread.
