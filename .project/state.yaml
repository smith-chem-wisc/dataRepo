skip_log:
  - date: 2026-09-22
    item: "threads.py QID regex cannot represent sdrf's SDRF-DR1..DR5 question IDs"
    reason: >-
      The checker validates question IDs against `^(?:REQ-)?[A-Z][A-Z0-9]{1,15}-[A-Z]?\d+$` -- ONE
      optional letter before the digits. `DATAREPO-28`, `LOGS-Q1` and `REQ-LOGS-5` all pass;
      `SDRF-DR1` fails, so sdrf's own question IDs cannot go in message front matter and `ledger`
      cannot track them. Worked around in our 004 by carrying them in the prose ledger and leaving
      `answers: []`, because renaming a peer's IDs is worse than not tracking them. NOT FIXED here
      deliberately: `threads.py` is a shared asset under `~/.claude/skills/project/assets/` used by
      all ten /project folders, so widening the regex is a change to every project's tooling and
      belongs in its own pass with the other nine in mind -- not at the end of a session, on our
      own authority, to suit one peer's naming.
  - date: 2026-09-20
    item: "G26 - replace the in-house modification registry with QuantProject's loader-generated IdWithMotif-to-Unimod.1.0.591.tsv"
    reason: >-
      Correctness is not in doubt (the loader is authoritative and we differ from it on two names,
      neither of which has fired), but consuming it would wire a third repository's file into the
      bundle content hash on our own authority, in the same release as the ptm_site_id rekey - two
      large movements confounded in one bundle id. The open part is distribution, not correctness,
      and it is asked in thread 021 section 5 with a default recorded as U9.
  - date: 2026-09-20
    item: "DATAREPO-20(a) - build the delivery path that lets aging hand over stage 7's age_effect rows"
    reason: >-
      The study layer's SHAPE is what aging asked for and what shipped. Building the command that
      carries rows into the repository would have fixed a hand-off contract before asking them how
      they want to hand rows over, on an object that does not exist yet. The default (a separate
      study bundle loaded by `build`) is recorded and is buildable under D7 if they go quiet.
    resolved: 2026-09-21
    resolution: >-
      Taken off the skip list and BUILT on the recorded default, after a day with no reply (D7).
      datarepo 0.7.0 ships `datarepo study` and `build --study`. The reversibility argument that
      made it a skip is what made it safe to build: a study bundle is a separate object, so if aging
      wants another hand-over only the reader changes, and no search bundle id moved. What is still
      unsettled is tracked as G30, and the build is re-stated to aging in thread 023.

