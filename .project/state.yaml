name: dataRepo
created: 2026-09-19
phase: INCEPTION

goal: >
  Design and build an AI-ready, API-accessible data repository that organizes the search + quant
  results (PSMs, peptides, proteoforms/PTMs, protein groups, FlashLFQ quant, provenance, SDRF design,
  GO/organelle annotation) from dozens-to-hundreds of PRIDE datasets reanalyzed by the aging pipeline,
  so humans and especially AI agents can query aging-related proteomic changes across organelles.

# SIBLING of aging: aging PRODUCES results (pipeline); dataRepo STORES + SERVES them.
#   aging -> run outputs on F:\aging_data\<run>\<PXD>\ with provenance.json (aging-provenance/2)
#   dataRepo ingests those; it never re-runs searches.
depends_on: [aging]

decisions:
  - id: D1
    date: 2026-09-19
    text: "Hosting: aging D5 applies. Prototype locally (data on F:, API on localhost); NCEMS operators run production from a portable Docker Compose package + handover doc. No Windows-only paths. (Closes G2; whether NCEMS hosts web services is G9.)"
  - id: D2
    date: 2026-09-19
    text: "Access: public from day one, no login anywhere (user: 'all open all the time'). Rate limiting lives in the operators' proxy, not our code. Versioned releases with a DOI from the start. (Closes G3.)"
  - id: D3
    date: 2026-09-19
    text: "Licences: data CC BY 4.0; code MIT."
  - id: D4
    date: 2026-09-19
    text: "Format: QPX-compatible superset. Use QPX column names/types where it has a matching view; extend for proteoforms, USI per PSM, organelle, age. Every file records the QPX version it matches. (Closes G6 part a.)"
  - id: D5
    date: 2026-09-19
    text: "Scope: human + rodent, DDA + DIA, label-free + TMT from v0 (user: 'definitely DIA and TMT and rodent'; aging's 'DIA is out' is wrong). organism, acquisition, quant_method, instrument_vendor are real columns. Quant table is long: (run, channel, feature, value). Only the aging-DDA-LFQ ingester is written now; DIA/TMT ingesters when aging produces that data (Q6 option A, taken by default; user may revisit). Relayed to aging as thread dataRepo/001 DATAREPO-1. (Closes G6 part b.)"
  - id: D6
    date: 2026-09-19
    text: "The benchmark questions come from aging, not dataRepo (user: 'have the aging project generate all the questions. let's keep this project just a bit more generic'). dataRepo stays generic: it stores, serves and is scored against a question set; it doesn't set the science agenda. How generic the schema gets is G10."
  - id: D7
    date: 2026-09-19
    text: "Every question that needs a human answer goes into design/OPEN_QUESTIONS.md with a default, grouped by who answers (NCEMS / user + working group / aging). The user takes it to meetings. Work proceeds on the defaults."

  - id: D8
    date: 2026-09-19
    text: "dataRepo is code, not data (user: 'this should just be code. I think aging should host the data'). This repo holds the schema, ingester, API/MCP server and deploy package, and never data. aging owns the data instance: the Parquet bundles, the release/changelog entries and DOIs (R2 is now an aging-instance table; dataRepo only defines it), and deploying the service over its results. Refines D1 (NCEMS still runs production, as aging's deployment) and D2 (aging's releases carry the DOIs). How much of running the service aging takes on is U6."

  - id: D9
    date: 2026-09-19
    text: >-
      Ingest contract (implemented, FRAMEWORK step 1). `datarepo ingest` reads the producing
      instance's manifest.yaml and never scans the work root: status include/hold/exclude is the
      producer's call and a non-include dataset is refused with their reason. Bundles are
      content-addressed on (inputs, schema version, ingester version), so re-ingest is a no-op and a
      changed input cannot overwrite a cited bundle. Parquet columns are generated from the LinkML
      schema (tools/build_tables.py, CI drift check), never hand-listed. pyMzLib parses producer
      formats; where dataRepo reads one itself the reason is recorded in the bundle's reader log and
      raised as a request. Every bundle reconciles its own counts against the producer's totals using
      the producer's acceptance rule, and a disagreement becomes a Finding, never a silent
      difference. Referential integrity is checked before any write. Definition IDs are namespaced
      `<owner>:<ID>` (U7) and numbers with no published definition use `PROVISIONAL:<NAME>`.

  - id: D10
    date: 2026-09-19
    text: >-
      Catalog contract (implemented, FRAMEWORK step 2). `datarepo build` loads an instance's bundles
      into one DuckDB file and never walks the store: the manifest is the contract here as it is for
      ingest, so a withdrawn dataset is refused with the producer's reason even though its bundle is
      on disk, and a dataset with several bundles is pinned (--bundle) or taken newest (--latest),
      never guessed. The catalog is derived and disposable - layer 1 stays the product - and is
      content-addressed on (bundle ids, schema version, builder version), so rebuilding is a no-op.
      Tables are materialised so the catalog is one movable file; every schema table exists even
      when empty; every row carries dataset_id and bundle_id, which is what gives `proteins` and
      `definitions` a dataset. The producing search engine's acceptance rule is applied once, in the
      views psms_1pct / peptidoforms_1pct / protein_groups_1pct, so the catalog's headline numbers
      are the numbers the bundle reconciled; a test asserts the SQL and the ingester's Python agree.
      Row counts, uniqueness and references are re-checked against the bundle manifests using
      integrity.py's own lists, a failure stops the build rather than becoming a Finding, and the
      build stages to a temporary file so a failure leaves the previous catalog serving.

  - id: D11
    date: 2026-09-19
    text: >-
      A release pins its bundles, and the tool enforces it. `datarepo build --release <version>`
      requires a --bundle pin for every dataset and refuses --latest outright (aging 011 asked for
      enforcement rather than a default). A release that can silently pick up a later re-ingest is
      not a release, and the failure is invisible: the catalog builds cleanly and says something
      other than what was cited. aging v0.1 is pinned to PXD036557=84ca279df425c0a2 at
      F:/aging_data/repo/releases/v0.1/catalog.duckdb.

  - id: D12
    date: 2026-09-21
    text: >-
      FRAMEWORK step 3 is the next build, and it is a LOCAL stdio MCP server. It is the only one of
      the four doors blocked by nobody: no host, no proxy, no NCEMS answer, no reply from aging.
      Three tools ship first - `datarepo_describe`, `datarepo_search`, `datarepo_sql` - and a fourth
      is added only where aging's benchmark shows the agent getting a specific answer wrong. The
      eight curated tools of FRAMEWORK section 4 are NOT built up front: most are thin wrappers over
      SQL we would write anyway, and several answer questions no measurement has asked yet. It runs
      as `datarepo mcp --catalog <path>`, a subcommand of the CLI already in use, and
      `datarepo mcp --install` writes the Claude Code config so no JSON is hand-edited; `datarepo
      doctor` reports whether it is registered. The official `mcp` SDK is an optional `[mcp]` extra,
      keeping the core at three dependencies as `[readers]` does. No R client in v1 - FRAMEWORK says
      "Python (+R)" and nobody asked for R; that is mzLibR's business (D1 rule).

  - id: D13
    date: 2026-09-21
    text: >-
      An MCP answer carries its provenance or it is not an answer. The server is pointed at ONE
      catalog file by explicit path - never auto-discovered - and every tool result carries the
      `catalog_id` and the bundle ids it drew on, which `catalog_meta` and `catalog_bundles` already
      record. Exploration is not restricted to release catalogs, because that would make new data
      unqueryable until a release is cut; instead any answer can be pinned after the fact, since
      D11 already makes a release name its exact bundles. The failure this forecloses is the one
      this repo keeps writing threads about: the same question answered twice, differently, with
      nothing in either result saying which data it saw.

  - id: D14
    date: 2026-09-21
    text: >-
      The SQL sandbox is built in two stages, because it does two different jobs. NOW, for the local
      server: `enable_external_access=false` with a locked config, a 1,000-row / 50k-character cap
      with a `truncated` flag, and a 30 s timeout via a watchdog thread calling `con.interrupt()`
      (DuckDB 1.5 has no `statement_timeout` parameter). LATER, when D2's public no-login endpoint
      exists: the sqlglot AST allow-list of FRAMEWORK section 4. Measured, not assumed -
      `read_only=True` alone is NOT a sandbox: a read-only connection ran
      `read_csv_auto` on a file outside the store and returned 212 rows, and ran
      `SELECT count(*) FROM range(3e9)` to completion. Locally the allow-list is not a security
      boundary (the agent already has the filesystem through Claude Code); it bounds blast radius.
      Publicly it bounds an attacker. Different job, different time.

  - id: D15
    date: 2026-09-21
    text: >-
      Step 3's done bar is ZERO SILENTLY-WRONG ANSWERS, not a percentage. FRAMEWORK's "agent answers
      >=X% of the question set" is the wrong measure here: SCHEMA_COVERAGE.md says 94 of aging's 168
      questions wait on a producer, so a score mostly measures aging's data and would jump when they
      deliver age effects with nothing about the server having changed. The bar: on an answerable
      question, right; on an unanswerable one, "no data" rather than an invention. Either kind of
      wrong is a failure. The percentage is reported, never targeted. The harness is ours so
      iteration is fast; the QUESTIONS live in aging's master and are read, never copied (the G5
      rule, D6), and the score goes to them in a thread rather than being claimed here.

  - id: D16
    date: 2026-09-21
    text: >-
      After step 3 comes the NO-SERVER half of steps 4-5, not the server. FRAMEWORK conflates "a
      server" with "on the web": static dataset pages with Bioschemas JSON-LD, `llms.txt`, Croissant
      and a Zenodo DOI on the release Parquet need no host, no proxy and no answer to N1/G9, and
      FRAMEWORK section 5 already says the site must work when the API is down. dataRepo ships the
      generator (`datarepo site <catalog> --out`); aging PUBLISHES the output, because D8 keeps
      data-derived artefacts out of this repo. The REST API and the Docker Compose package are
      DEFERRED pending two things: N1/G9 answered, and evidence of a human who wants REST - the
      main users are agents (project goal) and MCP plus static pages plus bulk Parquet already serve
      them. N1/G9 goes to the next NCEMS meeting regardless; it is now the long pole for D1.

  - id: D17
    date: 2026-09-21
    text: >-
      A dataset landing page carries a machine-written summary, auto-published with a visible
      "generated" label, and it is GROUNDED BY CONSTRUCTION: the model may read only fields the
      catalog holds plus aging's own manifest `reason`/`notes`, and nothing else - not PRIDE's
      abstract, not the paper, not what a model believes about the accession. So it can be clumsy
      and it cannot be false about biology, which is what makes auto-publishing acceptable under the
      NCEMS credit line. FRAMEWORK section 5's "human reviews it in a PR" is rejected as unrunnable:
      300 datasets means 300 reviews with no owner, and the honest prediction is the rule gets
      quietly dropped and they ship unreviewed anyway. The site is a derived artefact like the
      catalog - regenerating a summary moves no bundle id and no catalog id, because nothing about
      it reaches a written row.

  - id: D18
    date: 2026-09-21
    text: >-
      Step 6 is auto-INGEST, never auto-RELEASE. D9 makes the manifest the contract, so the shape is
      aging's pipeline appending to their manifest and calling `datarepo ingest` as each PXD
      finishes - a push from them, not a watcher of ours, and a thread to aging rather than a
      decision here. New data may appear in a working catalog; it never enters a release anyone has
      cited, which is D11 and D13 holding one level further out.

  - id: D19
    date: 2026-09-22
    text: >-
      FRAMEWORK step 3 is BUILT (0.10.0) and MEASURED (0.11.0), and the measurement decided two
      things D12 had left open. FIRST: there is NO FOURTH TOOL. The benchmark run found 7 of 17
      questions with a live path to a confident falsehood, and six of the seven reduced to one
      cause -- every 'this table is empty, do not answer from it' guard lived in `describe` and
      `search`, the two tools an agent may skip, and was absent from `datarepo_sql`, the tool that
      answers everything else and the one `describe`'s own next-step block points at. The fix is a
      field in tool 3's envelope (`tables_touched`, `empty_tables`), not a tool 4, and the
      reasoning generalises: **a tool has to be chosen, an envelope field cannot be skipped.** A
      guard belongs on the path that cannot be avoided, not on the path where it is easiest to
      write. SECOND: D15's bar is a property of OUTPUT SHAPE, not of row correctness -- every fix
      in 0.11.0 changes what a result SAYS about itself rather than what it contains, and the
      tests assert shape. A fourth tool is still possible under D12 if aging's own run shows a
      specific wrong answer an envelope cannot fix; nothing so far has.
  - id: D20
    date: 2026-09-22
    text: >-
      PROVENANCE IS A FACT ABOUT THE SERVER AND IS INFERRED FROM NOTHING. Every MCP result carries
      the same block: `catalog_id`, the versions, whether the catalog is a release or a working
      build, and every bundle the catalog holds. It does NOT narrow to what an answer touched.
      0.11.0 narrowed by reading the result's own `bundle_id`/`dataset_id` columns, and a query can
      put anything in a column with those names -- `SELECT max(dataset_id) AS dataset_id, count(*)
      FROM ptm_sites` returned a catalog-wide count stamped with one dataset's bundle, in the words
      a correct narrowing uses. Rejecting ids the catalog does not hold closed the REPRODUCTION and
      not the CLASS. The narrowing was never needed: `catalog_id` is a hash of the exact (dataset,
      bundle) set, so naming it already states which frozen copy of every dataset was available --
      the whole citation in one field, immune to the class. The user's framing settled it: releases
      are versioned, so 'I got this from version X' IS the answer. Corollary, and the general form:
      `tables_touched` reads the QUERY, not the ENGINE, so it is a hint and never evidence -- a CTE
      named after a real table certified a fabricated number with that table's row count attached.
      **A verification mechanism that can be steered by the thing it verifies is worse than none.**
      Do not reintroduce per-answer narrowing without deriving it from execution rather than from
      the result.
  - id: D21
    date: 2026-09-22
    text: >-
      dataRepo ASKS ITS UPSTREAMS DIRECTLY. Until 2026-09-22 this project had one thread peer,
      aging, while eight open gaps named an upstream we needed something from (QuantProject,
      pyMzLib, mzLib, MetaMorpheus, go). Every request went through aging as a proxy, and a proxy
      is not merely indirect: our own 012 section 2 measurement reached `go` through aging carrying
      a mechanism we had already disproved, and aging had to retract it on our behalf -- their
      words, that the sentence 'transplanted a number out of a comparison it was measured in, into
      a claim it does not support'. **The number survives the hop; the reason does not.** Channels
      are now open with go, sdrf, pyMzLib, QuantProject, pride, qc, pep and phred (001 on each,
      2026-09-22) -- NINE peers counting aging -- all using the
      same `design/threads/<peer>/` convention on both sides. The rule: **a consumer who does not
      state their requirements has delegated the design of their own inputs to someone with less
      information**, and one who states them through an intermediary has delegated the reasoning
      too. Every thread also OFFERS measurement back -- we ingest at corpus scale and a count takes
      minutes -- because a producer guessing at a distribution we can query is waste on both sides.
      Corollary held deliberately: dataRepo will have a second consumer (a project not yet started)
      and we do NOT build for it; when it exists it states its needs, same rule pointed outward.

  - id: D22
    date: 2026-09-22
    text: >-
      Accepted go's column contract (their 002), and refused the one column we cannot ground.
      TAKEN AS RULED: their D22 makes `accession_used` set-valued and equal to exactly the group
      members carrying a term, so we expand their `(protein_group, term)` row over
      `accession_used` and NEVER over our own `protein_accessions` -- the broadcast problem in our
      001 section 2 disappears, and every stored row is an accession that genuinely carries the
      term. `inherited` and `propagated` are nullable booleans, two-state, with NO distance column
      (GO is a DAG, so a distance needs a hidden shortest-vs-longest path rule that would live
      nowhere). `organelle_label` is renamed `organelle_category`, nullable; subcategory is stored
      WITH its `mitochondrion:inner_membrane` qualification, because stripping the prefix
      re-creates the position-pairing hazard it exists to remove. Three version fields, not one:
      `AnnotationSource.version` = the organelle map, `.ontology_release` = the go.obo release,
      `.output_format_version` = the column set, which is the one that lets the ingester refuse an
      unknown format loudly instead of silently mapping a shifted column. REFUSED:
      `accession_is_leading` (G43) -- the producer exposes no razor protein and sorts its accession
      list alphabetically, so the column would assert what the data never said. Our schema stops
      citing REQ-GO-2..10; go's standing instruction is 'trust D1-D22'. HELD pending DATAREPO-29/30:
      whether `organelle_category`/`organelle_subcategory` live in a term-keyed table rather than
      repeated per protein, since both are a function of `(go_id, organelle_map_version)` alone.

  - id: D23
    date: 2026-09-22
    text: >-
      The identifier seam with `logs` (cross-species orthology, tenth peer, opened 2026-09-22).
      Their OWNERSHIP.md flagged two capabilities as possibly colliding with us and we conceded
      both in our 001. **Accession-to-gene resolution is theirs**: our `Protein.gene` is
      MetaMorpheus's `Gene` column stored verbatim with no lookup, and on real data 20,022 distinct
      accessions carry 19,743 distinct gene strings with 5 accessions disagreeing with themselves
      across datasets -- gene is not a function of accession here, which is a faithful record and
      not a resolution. **Identifier STORAGE stays ours and is not negotiable** (D9): we store the
      producer's string verbatim, because normalising on the way in stops the thing we are a
      repository OF being reproducible. **Normalization is theirs** -- `canonical_accession` only
      strips an isoform suffix, is a string operation with no reference data behind it, and has
      never once fired (0 of 110,910 non-decoy rows). Secondary/demerged/obsolete accessions and
      RefSeq-UniProt mapping are logs' to own and ours to store as their output. Also told them
      `protein_annotations` (key/value string, dataset-keyed) is the WRONG home for their
      one-to-many output and asked them to confirm it before either side builds -- the G39 lesson
      applied before it costs anything.
  - id: D24
    date: 2026-09-23
    text: >-
      dataRepo NEVER DEFINES, but it DOES RUN (user decision, 2026-09-23; amends D1 and D8's "store and
      serve, never compute"). The generic engines (go, logs, ptmQtl, phred) own their logic,
      definitions and versions and never learn which consumer they serve; dataRepo executes their
      RELEASED, pinned versions on stored data for whichever consumer asks, and stores the output with
      engine version, inputs and definition id. The split is by where the code executes: engines that
      run INSIDE the MetaMorpheus search (phred Q_loc, QuantProject quant, sdrf SDRF, possibly go) are
      run by aging's pipeline, and dataRepo ingests them; engines that run ON STORED RESULTS (logs gene
      resolution, ptmQtl fits, possibly go) are run by dataRepo. Reason, in the user's words: "I don't
      want critical tasks to slip through the cracks between projects with each one thinking it is the
      others responsibility." Under the old rule, no engine ran itself, dataRepo ran none, and running
      them had no owner. REVERSES our logs 013 answer (option b, now a). The full split, the seams
      and the sign-off table are in design/CHARTER.md; it is not in force until all eight parties
      (aging, go, logs, ptmQtl, phred, sdrf, QuantProject, pyMzLib) sign their rows.

  - id: D25
    date: 2026-09-23
    text: >-
      The public site (FRAMEWORK step 4a, D16/D17) is BUILT (`datarepo site`, 0.17.0) and PUBLISHED as a
      preview on an orphan `gh-pages` branch of the PUBLIC `trishorts/aging-pipeline`, at
      https://trishorts.github.io/aging-pipeline/ (user decision). Why there: the user wanted it "under
      the umbrella of the aging project", `trishorts/aging` is PRIVATE, and free Pages needs a public
      repo; a new repo was the rejected alternative (one more thing to track). Why now, before the
      re-ingest: D2 (public from day one), with a `--notice` banner on every page and on llms.txt saying
      the numbers will change -- removed after aging's re-ingest and rebuild. The front page's
      overview is aging's text (`--about`, drafted from aging-pipeline's README, handed over in thread
      051), not dataRepo's. Regenerating after each ingest is asked of aging as DATAREPO-38; the default
      is that we regenerate by hand when they say a rebuild is done.

  - id: D26
    date: 2026-09-23
    text: >-
      A reader change whose output is PROVEN identical does not bump INGESTER_VERSION. 0.17.2 reads a
      `.psmtsv` over 512 MiB in limit/offset windows (DATAREPO-37). The hash rule exists so that
      different rows never share a bundle id; here the rows are the same by measurement (PXD067622,
      966,134 records, all 73 columns identical windowed vs whole; fixture forced into 7-record
      windows identical) and every file that ingested before takes the unchanged single-read path.
      Bumping would have re-identified every bundle in the middle of aging's re-ingest for zero
      change in any row. The test stays one sentence -- does this change what the rows say -- and
      "proven not" is an answer, "probably not" is not.

  - id: D27
    date: 2026-09-23
    text: >-
      dataRepo SHIPS; an instance's OPERATOR RUNS (user decision, 2026-09-23; revises D24's RUN half,
      completes D8). The dataRepo PROJECT operates nothing: it does not run engines, ingest, build or
      publish for any consumer. It defines and ships the software and its contracts -- schema,
      ingest/catalog contracts, provenance, the MCP server, the site generator, and the runner command
      through which an operator executes a released engine on stored data, which also fixes how an engine
      run is recorded. Whoever operates an instance runs all of it on that instance: today aging, which
      already runs ingest, build and the site (D8, D25, aging D42). D24's first half stands: dataRepo never
      DEFINES, and engines stay generic. The user's reason: "if I truly want dataRepo to be generic, then I
      better let the /project aging actually take over the running of the dataRepo whenever it wants to.
      Then dataRepo can just focus on what it means to be dataRepo." A consumer-operator role for the
      dataRepo project cannot extend to a second consumer. Consequences: U11 dissolves (aging runs its own
      fits and the generic engines alike); operator docs and examples may use aging data for a while, but
      aging's specifics stay in aging's `instance/` and dataRepo's CI stays on a non-aging fixture;
      dataRepo keeps scratch runs on real data to TEST its software (findings come from filling), and
      never serves or publishes them. The charter moves to v0.3 only after aging accepts the operator
      role (G61).
  - id: D28
    date: 2026-09-24
    text: >-
      The runner's shape (user decision, 2026-09-24, U12-U15 accepted as proposed in design/RUNNER.md).
      (U12) An engine's output is a separate artefact at `<store>/_engine/<engine>/<artefact id>/`,
      beside the bundles and never inside one. (U13) Its id, and the "already done" test, is a sha256
      over the engine, its released version, every input's role and sha256, the definition id,
      RUNNER_VERSION and the schema version -- not the bundle id, so one logs run serves every dataset
      that searched the same database. (U14) The operator supplies every input file; the runner
      fetches nothing and checks each against the engine's published manifest. (U15) logs' rows go in a
      new core table `gene_resolutions` keyed (search_database_sha256, gene_set_release, accession,
      gene_id), added in ONE schema change together with go's per-row evidence columns. Building still
      waits on aging's review as operator (DATAREPO-50).
  - id: D29
    date: 2026-09-25
    text: >-
      PTM site occupancy (`ptm_stoichiometry`) is filled by OUR INGESTER from MetaMorpheus's own
      per-run occupancy (`CountOccupancy_` / `IntensityOccupancy_` cells in
      AllQuantifiedProteinGroups.tsv, read with pyMzLib `read_occupancy`), not from ptmQtl's recomputed
      table (user decision, 2026-09-25; QuantProject 006: every design-less search already writes it).
      KEEP AS MUCH AS POSSIBLE, in the user's words, "since this is such an important measurement in the
      repo": both bases (count and intensity), each basis's exact numerator and denominator (the written
      fraction is rounded to 2 decimals), the fraction as written, whether the denominator covers one
      run or a pooled sample group (QuantProject DEF-OCC-GROUPING), explicit floor AND ceiling flags,
      the sample label, is_n_terminus, and the group member the site belongs to (checked against the
      searched sequence, never trusted by position).
  - id: D30
    date: 2026-09-25
    text: >-
      ptmQtl's first bundle (121,798 occupancy / 70,578 pair rows, engine = draft mzLib #1369) is TEST
      DATA ONLY: used to build and check table shapes, never served, until the engine is released and
      the operator runs it through the runner (D27). User decision, 2026-09-25 (ptmQtl P12).
  - id: D31
    date: 2026-09-25
    text: >-
      `ptm_pairs` takes ptmQtl's site grain and per-species pooling (user decision, 2026-09-25; ptmQtl
      P9, P10): a `feature_type` column says what each side is (as in `trait_effects`); `scope` may be
      a dataset, `meta`, or `meta:<species>`; pooled rows list their `datasets`; the dataset count gets
      its own column `n_datasets`, and `n` ALWAYS means runs (total over the pooled datasets, or NULL) --
      one column never holds two units (the spectral-count lesson, 0.18.0).
  - id: D32
    date: 2026-09-26
    text: >-
      Derive at BUILD, not at ingest, when the fact is already stored verbatim in the bundle. A core
      schema bump makes every stored bundle refuse to build until the operator re-ingests the whole
      corpus, so it is spent only on facts the bundle does not hold. Applied twice on 2026-09-26: G74's
      `samples.<col>_name` come from `sample_characteristics` at build (0.25.0), and aging's public
      pipeline commit (55e) is read by the site from the bundle's own provenance copy (0.24.0) -- a
      0.0.12 schema for two link columns was written and reverted. Default (dataRepo), not a user ruling.
  - id: D33
    date: 2026-09-26
    text: >-
      dataRepo publishes no usable / caution / exclude verdict on a dataset (aging 069 55d). It shows
      finding counts by severity and finding types; whether a dataset is fit for a question is a
      definition, and by D24 the instance owner would publish it (we display its result if they do).
  - id: D34
    date: 2026-09-26
    text: >-
      Every MCP answer carries COMPACT provenance (catalog_id, versions, n_bundles, kind); the full
      bundle list is only in describe() with no target (aging 070 DATAREPO-58). catalog_id hashes that
